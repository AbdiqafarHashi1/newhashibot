# DEMO SHADOW ONLY. Configure the trigger with Cloud Build manual approval.
substitutions: {_REGION: us-central1, _REPOSITORY: hashibot-demo, _DEPLOY_APPROVED: 'false'}
steps:
- {id: install, name: 'node:20.20.2', entrypoint: npm, args: [ci, --ignore-scripts]}
- id: gates
  name: node:20.20.2
  entrypoint: bash
  args: [-ceu, 'npm run test:phase13 && npm run test:runtime-services && npm run test:cloud-deployment && npm run typecheck:cloud && cloud/scripts/security-audit.sh']
- id: approval-guard
  name: bash:5.2
  args: [-ceu, 'test "$PROJECT_ID" = hashibot-demo; test "${_REGION}" = us-central1; test "${_DEPLOY_APPROVED}" = true']
- id: build
  name: gcr.io/cloud-builders/docker
  entrypoint: bash
  args: [-ceu, 'REGISTRY=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY} BUILD_ID=$BUILD_ID cloud/scripts/build-all.sh "$COMMIT_SHA"']
- id: push
  name: gcr.io/cloud-builders/docker
  entrypoint: bash
  args: [-ceu, 'REGISTRY=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY} BUILD_ID=$BUILD_ID cloud/scripts/push-all.sh "$COMMIT_SHA"']
- id: terraform-plan-apply
  name: hashicorp/terraform:1.9.8
  entrypoint: sh
  args: [-ceu, 'TF_VAR_deploy_approved=true TF_VAR_image_tag=$COMMIT_SHA cloud/scripts/terraform-plan-demo.sh && TF_VAR_deploy_approved=true cloud/scripts/terraform-apply-demo.sh artifacts/demo.tfplan']
- id: deploy-digests
  name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
  entrypoint: bash
  args: [-ceu, 'cloud/scripts/deploy-shadow.sh "$COMMIT_SHA"']
- id: certify
  name: gcr.io/google.com/cloudsdktool/google-cloud-cli:stable
  entrypoint: bash
  args: [-ceu, 'BUILD_ID=$BUILD_ID COMMIT_SHA=$COMMIT_SHA cloud/scripts/verify-shadow.sh artifacts/deployment-certification.json']
options: {logging: CLOUD_LOGGING_ONLY}
artifacts: {objects: {location: 'gs://${PROJECT_ID}-build-artifacts/deployments/${BUILD_ID}', paths: ['artifacts/deployment-certification.json', 'artifacts/demo.tfplan']}}
