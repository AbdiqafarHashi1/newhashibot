# HashiBot Supabase function deployment configuration.
# Do not disable JWT globally. Internal-only functions that use the repository
# x-hashibot-internal-secret guard set verify_jwt=false per function so the
# Supabase gateway allows the request to reach the handler for custom M2M auth.

[functions.admin-operator-action]
verify_jwt = true

[functions.bybit-demo-execution]
verify_jwt = false

[functions.scheduled-market-scanner]
verify_jwt = false

[functions.market-scanner]
verify_jwt = false

[functions.binance-testnet-execution]
verify_jwt = false

[functions.binance-testnet-monitor]
verify_jwt = false

[functions.bybit-testnet-monitor]
verify_jwt = false

[functions.telegram-test]
verify_jwt = false

[functions.intelligence-engine]
verify_jwt = false

[functions.evaluate-signal-outcomes]
verify_jwt = false

[functions.mt5-accounts]
verify_jwt = true

# Provider-authenticated endpoint. Function code must verify the raw Whop signature.
[functions.whop-webhook]
verify_jwt = false

# Existing orchestrator also receives Telegram updates authenticated by Telegram's secret header.
[functions.telegram-orchestrator]
verify_jwt = false

# Telegram secret-header webhook plus independently authenticated worker/admin requests.
[functions.telegram-membership]
verify_jwt = false

[functions.commerce-checkout]
verify_jwt = true

# Provider callback authentication is verified from the raw request before inbox persistence.
[functions.mpesa-webhook]
verify_jwt = false

[functions.free-enrollment]
verify_jwt = true

[functions.commerce-reconcile]
verify_jwt = false

[functions.canonical-reporting-worker]
verify_jwt = false

[functions.phase-m-shadow]
verify_jwt = true

[functions.phase-m-validation]
verify_jwt = true

[functions.phase-n-operations]
verify_jwt = true

[functions.phase-n-command-worker]
verify_jwt = false

[functions.phase-o-agents]
verify_jwt = true

[functions.phase-o-worker]
verify_jwt = false

[functions.account-signal-authorization]
verify_jwt = false

[functions.saas-launch-status]
verify_jwt = true

[functions.commerce-configuration]
verify_jwt = true
