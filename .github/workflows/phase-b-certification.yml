name: Phase B Real-Data Certification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: Acquire real data and certify Phase B
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore immutable Phase B dataset cache
        uses: actions/cache@v4
        with:
          path: |
            .research-cache/phase-b/datasets/
            .research-cache/phase-b/chunks/
            .research-cache/phase-b/raw/
          key: phase-b-real-data-v3-${{ hashFiles('scripts/phase-b/acquire-real-data.ts', 'src/lib/historicalData/adapters.ts', 'src/lib/historicalData/histData.ts') }}
          restore-keys: |
            phase-b-real-data-v3-

      - name: Acquire real market data
        id: acquisition
        continue-on-error: true
        timeout-minutes: 30
        env:
          PHASE_B_ACQUISITION_CONCURRENCY: "4"
          PHASE_B_DUKASCOPY_CONCURRENCY: "2"
          PHASE_B_ACQUISITION_HARD_TIMEOUT_MS: "1500000"
          HISTORICAL_REQUEST_TIMEOUT_MS: "15000"
          HISTORICAL_RETRY_BUDGET_MS: "60000"
          HISTORICAL_REQUEST_DELAY_MS: "0"
          HISTORICAL_RETRY_BASE_MS: "2000"
          HISTORICAL_MAX_ATTEMPTS: "4"
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: |
          mkdir -p .research-cache/phase-b/logs
          set -o pipefail
          npm run research:acquire-real-data 2>&1 | tee .research-cache/phase-b/logs/acquisition.log

      - name: Run Phase B certification
        id: certification
        if: always()
        continue-on-error: true
        timeout-minutes: 180
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          mkdir -p .research-cache/phase-b/logs
          set -o pipefail
          npm run research:phase-b-certify 2>&1 | tee .research-cache/phase-b/logs/certification.log

      - name: Upload Phase B reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-b-certification-reports-${{ github.run_id }}
          path: |
            .research-cache/phase-b/acquisition-report.json
            .research-cache/phase-b/certification-report.json
            .research-cache/phase-b/policy-manifest.json
            .research-cache/phase-b/evidence/
            .research-cache/phase-b/raw/**/*.json
            .research-cache/phase-b/logs/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Upload Phase B research cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-b-research-cache-${{ github.run_id }}
          path: |
            .research-cache/phase-b/campaign-*.json
            .research-cache/phase-b/datasets/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Enforce acquisition and certification results
        if: always()
        env:
          ACQUISITION_OUTCOME: ${{ steps.acquisition.outcome }}
          CERTIFICATION_OUTCOME: ${{ steps.certification.outcome }}
        run: |
          echo "Acquisition outcome: ${ACQUISITION_OUTCOME}"
          echo "Certification outcome: ${CERTIFICATION_OUTCOME}"
          required=(acquisition-report.json certification-report.json policy-manifest.json evidence/strategy-edge.json evidence/pipeline.json evidence/arbitration.json evidence/signals.json evidence/personal.json evidence/prop.json evidence/portfolio.json evidence/lineage.json evidence/payout-model.json evidence/combined-pipeline.json evidence/combined-arbitration.json evidence/combined-signals.json evidence/combined-personal.json evidence/combined-prop.json evidence/combined-funded.json evidence/combined-payout.json evidence/combined-lineage.json)
          missing=()
          for file in "${required[@]}"; do
            [ -s ".research-cache/phase-b/${file}" ] || missing+=("${file}")
          done
          if [ "${ACQUISITION_OUTCOME}" != "success" ] || [ "${CERTIFICATION_OUTCOME}" != "success" ] || [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::PHASE_B_EXECUTION_BLOCKED acquisition=${ACQUISITION_OUTCOME} certification=${CERTIFICATION_OUTCOME} missing=${missing[*]:-none}"
            exit 1
          fi
          echo "Phase B execution complete; research verdict is recorded in certification-report.json."
