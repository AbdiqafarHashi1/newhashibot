name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-edge-functions:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Edge Function deploy list and imports
        run: npm run check:edge-functions

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy real Edge Functions only
        run: |
          supabase functions deploy binance-testnet-execution --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy binance-testnet-monitor --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy market-scanner --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy evaluate-signal-outcomes --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy telegram-send --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy telegram-test --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy telegram-orchestrator --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
          supabase functions deploy intelligence-engine --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
