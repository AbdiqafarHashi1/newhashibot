name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Type DEPLOY_VERIFIED_RELEASE after release verification and owner authorization'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    if: inputs.approval == 'DEPLOY_VERIFIED_RELEASE'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions with repository JWT policy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run deploy:edge-functions -- --project-ref uqiwbzfcntlcyyewawfc
