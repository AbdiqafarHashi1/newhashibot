name: Original HashiBot SaaS checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-saas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install python-dotenv==1.2.4
      - run: npm ci --no-audit
      - run: npm run typecheck
      - run: npm run check:edge-bundles
      - run: npm run typecheck:account-authorization
      - run: npm run build
      - run: npm run test:release1
      - run: npm run test:operations-readiness
      - run: python3 -m unittest discover -s mt5-agent/tests
      - run: npm run test:strategies
      - run: npm run test:phase-l
      - run: npm run test:indicators-arbitrator
      - run: npm run test:phase-i
      - run: npm run test:phase-m
      - run: npm run test:phase-p
      - run: npm run typecheck:cloud
      - run: npm run audit:admin-surfaces
      - name: Required production dependency audit
        env:
          npm_config_fetch_timeout: '20000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
          npm_config_fetch_retry_maxtimeout: '1000'
        run: npm audit --omit=dev --audit-level=moderate

  release1-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - run: npx playwright test -c playwright.release1.config.ts
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit
      - run: npm run lint

  release-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package exact candidate source
        run: git archive --format=tar.gz HEAD -o /tmp/hashibot-release-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-source-${{ github.sha }}
          path: /tmp/hashibot-release-source.tar.gz
          retention-days: 7
