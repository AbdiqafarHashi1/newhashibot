name: Original HashiBot SaaS checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: original-saas-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install python-dotenv==1.2.4
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:edge-bundles
      - run: npm run typecheck:account-authorization
      - run: npm run build
      - run: npm run test:release1
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run test:operations-readiness
      - run: python3 -m unittest discover -s mt5-agent/tests
      - run: npm run test:strategies
      - run: npm run test:phase-l
      - run: npm run test:indicators-arbitrator
      - run: npm run test:phase-i
      - run: npm run test:phase-m
      - run: npm run test:phase-p
      - run: npm run typecheck:cloud
      - run: npm run audit:admin-surfaces

  release1-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:web
      - run: npx playwright test -c playwright.release1.config.ts
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
