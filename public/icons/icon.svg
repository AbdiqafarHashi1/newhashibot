<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#3b82f6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Shape -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-opacity="0.25" />

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glow)" />

  <!-- Central Graphic: Hexagonal Shield + Lightning Monogram -->
  <g filter="url(#dropShadow)">
    <!-- Hexagonal Shield Outline -->
    <path d="M 256 96 L 384 168 L 384 320 L 256 396 L 128 320 L 128 168 Z" fill="#18181b" fill-opacity="0.75" stroke="url(#accentGrad)" stroke-width="5" stroke-linejoin="round" />
    
    <!-- Bold Lightning Bolt / Zap Monogram -->
    <path d="M 276 140 L 184 272 L 244 272 L 224 372 L 328 236 L 268 236 Z" fill="url(#boltGrad)" />
    <path d="M 276 140 L 232 236 L 268 236 L 224 372 L 236 296 L 184 272 Z" fill="#93c5fd" fill-opacity="0.6" />
  </g>

  <!-- Accent Indicator Dots -->
  <circle cx="256" cy="436" r="6" fill="#38bdf8" />
  <circle cx="236" cy="436" r="3" fill="#60a5fa" fill-opacity="0.5" />
  <circle cx="276" cy="436" r="3" fill="#60a5fa" fill-opacity="0.5" />
</svg>
